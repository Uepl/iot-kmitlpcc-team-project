{% extends 'bar.html' %}

{% block title %}Artists{% endblock %}

{% block content %}
    <div class="container mt-5">
        <h1>Records</h1>
        
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for record in records %}
                <tr>
                    <td>{{ record['id'] }}</td>
                    <td>{{ record['name'] }}</td>
                    <td>
                        <a href="{{ url_for('editRecord', record_id=record['id']) }}" class="btn btn-sm btn-warning">Edit</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <a href="{{ url_for('index') }}" class="btn btn-primary mb-3">back</a>
{% endblock %}
